        courseForm.addEventListener('submit', function(e) {

            let courseID = courseForm.elements[1].value;
            let semester = courseForm.elements[2].value;
            let courseColor = courseForm.elements[3].value;

            console.log(courseName, courseID, semester, courseColor);
            
            // create button for each course
            let button = document.createElement("button")
            button.className = "courseButton"        
            button.style.backgroundColor = courseColor

            let courseLabel = document.createElement("p")
            courseLabel.className = "courseLabel"
            courseLabel.textContent = courseID

            let buttonDiv = document.createElement("div")
            buttonDiv.className = "courseButtonDiv"

            buttonDiv.appendChild(button)
            buttonDiv.appendChild(courseLabel)


            coursePanel.appendChild(buttonDiv)
        })
